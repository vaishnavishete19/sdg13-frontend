<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SDG 13 – Climate AI Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FONT CHANGED -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  display:flex;
  height:100vh;
  background:#f2f7f9;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:240px;
  background:#0a3d62;
  color:#fff;
  padding:25px 15px;
}

.sidebar h2{
  margin-bottom:35px;
  font-size:20px;
  text-align:center;
}

.menu-btn{
  padding:14px;
  margin-bottom:12px;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
}

.menu-btn:hover,
.menu-btn.active{
  background:#1e6091;
}

/* ===== MAIN ===== */
.main{
  flex:1;
  padding:25px;
  overflow:hidden;
}

/* ===== SECTIONS ===== */
.section{display:none;}
.section.active{display:block;}

/* ===== CHAT ===== */
.chat-box{
  height:70vh;
  background:#ffffff;
  border-radius:16px;
  padding:18px;
  overflow-y:auto;
  box-shadow:0 10px 24px rgba(0,0,0,0.08);
}

.msg{
  max-width:75%;
  padding:14px 18px;
  border-radius:18px;
  margin-bottom:12px;
  line-height:1.6;
  font-size:15px;
}

.bot{
  background:#e3f2fd;
  border-left:4px solid #1e88e5;
}

.user{
  background:#bbdefb;
  margin-left:auto;
  text-align:right;
}

/* ===== INPUT ===== */
.chat-input{
  display:flex;
  gap:12px;
  margin-top:15px;
}

.chat-input input{
  flex:1;
  padding:16px 20px;
  border-radius:35px;
  border:1px solid #b0bec5;
  font-size:16px;
}

.chat-input button{
  width:48px;
  height:48px;
  border-radius:50%;
  border:none;
  background:#1e88e5;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* ===== IMPACT ===== */
.card{
  max-width:480px;
  background:#ffffff;
  padding:25px;
  border-radius:16px;
  box-shadow:0 10px 24px rgba(0,0,0,0.08);
}

.card input{
  width:100%;
  padding:14px;
  margin:10px 0 18px;
  border-radius:10px;
  border:1px solid #b0bec5;
  font-size:15px;
}

.card button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#1e88e5;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.result{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  font-weight:600;
}

/* ===== HISTORY ===== */
.history-item{
  background:#ffffff;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  box-shadow:0 6px 14px rgba(0,0,0,0.08);
}
</style>
</head>

<body>
<!-- BODY CONTENT UNCHANGED -->
</body>
</html>
