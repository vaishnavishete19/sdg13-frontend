<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SoftClimate AI Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(180deg,#f7e8ff,#ffe4f3);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#3a235c;
}

/* ===== CONTAINER ===== */
.wrapper{
  width:100%;
  max-width:900px;
  background:#ffffffcc;
  backdrop-filter:blur(14px);
  border-radius:30px;
  padding:30px;
  box-shadow:0 30px 60px rgba(150,80,200,0.18);
}

/* ===== HEADER ===== */
.title{
  text-align:center;
  margin-bottom:20px;
}

.title h1{
  font-size:34px;
  font-weight:600;
}

.title p{
  margin-top:8px;
  font-size:16px;
  opacity:0.85;
}

/* ===== CHAT ===== */
.chat-area{
  background:#fdf7ff;
  border-radius:24px;
  padding:20px;
  height:360px;
  overflow-y:auto;
  box-shadow:inset 0 0 10px rgba(180,120,220,0.15);
}

.msg{
  max-width:78%;
  padding:14px 18px;
  border-radius:18px;
  margin-bottom:12px;
  font-size:15px;
  line-height:1.5;
}

.bot{
  background:#efe2ff;
}

.user{
  background:#ffd6eb;
  margin-left:auto;
  text-align:right;
}

/* ===== INPUT ===== */
.input-area{
  display:flex;
  gap:12px;
  margin-top:16px;
}

.input-area input{
  flex:1;
  padding:16px 18px;
  border-radius:30px;
  border:1px solid #e0c9f2;
  font-size:15px;
}

.input-area button{
  width:52px;
  height:52px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#d16ba5,#b76be4);
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* ===== NEW CHAT ===== */
.new-chat-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:20px;
  background:#b76be4;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  margin-top:12px;
}

/* ===== HISTORY ===== */
.history{
  margin-top:20px;
}

.history h3{
  font-size:16px;
  margin-bottom:8px;
}

.history-item{
  background:#efe2ff;
  padding:10px 14px;
  border-radius:14px;
  margin-bottom:6px;
  font-size:13px;
}

/* ===== IMPACT ===== */
.impact-container{
  margin-top:25px;
  background:#fff;
  padding:20px;
  border-radius:22px;
  box-shadow:0 10px 25px rgba(180,120,220,0.15);
}

.impact-container h3{
  margin-bottom:15px;
}

.impact-container input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #e0c9f2;
}

.impact-container button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:14px;
  background:#d16ba5;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

.result{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#ffe4f3;
  font-weight:600;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="title">
    <h1>SoftClimate AI</h1>
    <p>AI Assistant for Climate, Carbon Awareness & Sustainability</p>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chatBox">
    <div class="msg bot">Hello 🌱 I’m SoftClimate AI. Ask me anything about climate or sustainability!</div>
  </div>

  <div class="input-area">
    <input id="userInput" placeholder="Ask a climate question..." />
    <button onclick="sendMessage()">➤</button>
  </div>

  <button class="new-chat-btn" onclick="newChat()">🆕 New Chat</button>

  <!-- IMPACT CALCULATOR -->
  <div class="impact-container">
    <h3>🌱 Carbon Footprint Calculator</h3>
    <input id="transport" type="number" placeholder="Transport km/day">
    <input id="electricity" type="number" placeholder="Electricity units/month">
    <input id="meat" type="number" placeholder="Meat meals/week">
    <button onclick="calculateImpact()">Check Impact</button>
    <div class="result" id="impactResult"></div>
  </div>

  <!-- CHAT HISTORY -->
  <div class="history">
    <h3>📜 Chat History</h3>
    <div id="historyList"></div>
  </div>

</div>

<script>
const chatBox = document.getElementById("chatBox");
const historyList = document.getElementById("historyList");
let history = [];

// ===== LOCAL CLIMATE AI =====
function localClimateReply(msg){
  msg = msg.toLowerCase();

  if(["hi","hii","hello","hey"].includes(msg))
    return "Hello 🌱 I’m SoftClimate AI. How can I help you with climate awareness today?";

  if(msg.includes("carbon"))
    return "Carbon is a natural element. CO₂ is a greenhouse gas that traps heat in the atmosphere.";

  if(msg.includes("co2"))
    return "CO₂ (carbon dioxide) is released by vehicles, factories, electricity generation, and deforestation.";

  if(msg.includes("climate change"))
    return "Climate change refers to long-term changes in Earth’s climate, mainly caused by human activities.";

  if(msg.includes("global warming"))
    return "Global warming is the rise in Earth’s temperature due to excess greenhouse gases.";

  if(msg.includes("sustainability"))
    return "Sustainability means using resources responsibly so future generations can thrive.";

  if(msg.includes("sdg"))
    return "SDG 13 focuses on urgent action to combat climate change and its impacts.";

  if(msg.includes("renewable"))
    return "Renewable energy comes from sources like solar, wind, and water which don’t run out.";

  if(msg.includes("deforestation"))
    return "Deforestation is cutting down forests, reducing carbon absorption and harming biodiversity.";

  return null;
}

// ===== ADD MESSAGE =====
function addMessage(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.textContent=text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// ===== SEND MESSAGE =====
async function sendMessage(){
  const input=document.getElementById("userInput");
  const text=input.value.trim();
  if(!text) return;

  addMessage(text,"user");
  history.push("You: "+text);
  updateHistory();
  input.value="";

  addMessage("Thinking... 🤖","bot");

  const local = localClimateReply(text);
  if(local){
    chatBox.lastChild.remove();
    addMessage(local,"bot");
    history.push("AI: "+local);
    updateHistory();
    return;
  }

  try{
    // fallback backend
    const res = await fetch("https://sdg13-backend.onrender.com/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text})
    });
    const data = await res.json();
    chatBox.lastChild.remove();
    addMessage(data.reply || "🌍 Climate action helps protect our planet.", "bot");
    history.push("AI: "+(data.reply || "Climate action helps protect our planet."));
    updateHistory();
  }catch{
    chatBox.lastChild.remove();
    addMessage("❌ Backend not responding","bot");
    history.push("AI: Backend not responding");
    updateHistory();
  }
}

// ===== NEW CHAT =====
function newChat(){
  chatBox.innerHTML=`<div class="msg bot">Hello 🌱 I’m SoftClimate AI. Ask me anything about climate or sustainability!</div>`;
  history=[];
  updateHistory();
}

// ===== CARBON FOOTPRINT CALCULATOR =====
function calculateImpact(){
  const t=Number(transport.value)||0;
  const e=Number(electricity.value)||0;
  const m=Number(meat.value)||0;

  const score=(t*0.4)+(e*0.05)+(m*1.5);
  let level="",color="";

  if(score<15){level="Low 🌱";color="#c8e6c9";}
  else if(score<30){level="Moderate ⚡";color="#fff3cd";}
  else{level="High 🔥";color="#fdecea";}

  impactResult.style.background=color;
  impactResult.innerHTML=`🌍 Score: <b>${score.toFixed(1)}</b><br>Impact: <b>${level}</b>`;
  history.push(`Impact → ${score.toFixed(1)} (${level})`);
  updateHistory();
}

// ===== UPDATE HISTORY =====
function updateHistory(){
  historyList.innerHTML="";
  history.slice(-8).forEach(h=>{
    const div=document.createElement("div");
    div.className="history-item";
    div.textContent=h;
    historyList.appendChild(div);
  });
}
</script>

</body>
</html>
